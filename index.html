<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Here We Go Phonics Spin (114學年度版)</title>
    <style>
        /* --- 全局設定 --- */
        body {
            background-color: #FFF8DC;
            font-family: 'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 {
            color: #8B4513;
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            text-align: center;
        }

        /* --- 設定大廳 (Setup Screen) --- */
        #setup-screen {
            background-color: #FFECB3;
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 5px solid #FFC107;
            width: 90%;
            max-width: 700px; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 95vh;
            overflow-y: auto; 
        }

        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 6px;
        }

        .form-group label {
            font-size: 16px;
            font-weight: bold;
            color: #3E2723;
        }

        .form-group select {
            padding: 8px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 8px;
            border: 2px solid #FF9800;
            background-color: #FFF;
            cursor: pointer;
        }

        /* --- 單元複選區 --- */
        .unit-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background-color: #FFE082;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #FFCA28;
        }

        .unit-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
        }
        .unit-label input { transform: scale(1.2); cursor: pointer; }

        /* --- 手動新增單字區 --- */
        .custom-word-input-group {
            display: flex;
            gap: 10px;
        }
        .custom-word-input-group input {
            flex: 1;
            padding: 8px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 8px;
            border: 2px solid #FF9800;
        }
        .custom-word-input-group button {
            padding: 8px 20px;
            font-size: 16px;
            font-family: inherit;
            background-color: #4CAF50;
            color: white;
            border: 2px solid #2E7D32;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .custom-word-input-group button:active { transform: translateY(2px); }

        /* --- 單字微調區 --- */
        .word-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .word-controls button {
            padding: 5px 15px;
            font-size: 14px;
            font-family: inherit;
            background-color: #FFB300;
            color: #3E2723;
            border: 2px solid #FF8F00;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .word-controls button:active { transform: translateY(2px); }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 8px;
            background-color: #FFF;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #FF9800;
            max-height: 150px;
            overflow-y: auto;
        }

        .word-checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
            background-color: #FFF8DC;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #FFE082;
        }
        .word-checkbox-label:hover { background-color: #FFECB3; }
        .word-checkbox-label input { cursor: pointer; transform: scale(1.1); }

        .start-btn {
            margin-top: 5px;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            border: 3px solid #1B5E20;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1B5E20, 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }

        .start-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #1B5E20;
        }

        /* --- 遊戲畫面 (Game Screen) --- */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-family: inherit;
            background-color: #FF9800;
            color: white;
            border: 2px solid #E65100;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #E65100;
            z-index: 10;
        }
        .back-btn:active { transform: translateY(3px); box-shadow: none; }

        .game-stage {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 95%;
            max-width: 900px;
            margin-top: 40px;
        }

        /* 左側：學生抽籤機 */
        .student-picker {
            background-color: #4CAF50;
            padding: 15px;
            border-radius: 15px;
            border: 4px solid #2E7D32;
            width: 200px;
            text-align: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
        }

        .picker-header { color: white; font-size: 18px; margin-bottom: 8px; font-weight: bold; }

        .name-display {
            background-color: #FFF;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #2E7D32;
            border: 2px solid #81C784;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .pick-btn {
            width: 100%;
            padding: 8px 0;
            font-size: 16px;
            font-family: inherit;
            background: linear-gradient(to bottom, #42A5F5, #1976D2);
            color: white;
            border: 2px solid #0D47A1;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #01579B;
        }
        
        .pick-btn:active { transform: translateY(3px); box-shadow: none; }
        .pick-btn:disabled { background: #cfd8dc; cursor: not-allowed; box-shadow: none;}

        .counter { margin-top: 8px; font-size: 14px; color: #E8F5E9; }

        /* 右側：拉霸機 */
        .slot-machine {
            background-color: #D32F2F;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.4), inset 3px 3px 10px rgba(255,255,255,0.2);
            border: 5px solid #B71C1C;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .reels-container {
            display: flex;
            gap: 8px;
            background-color: #222;
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 10px #000;
            border: 3px solid #444;
        }

        .reel {
            width: 70px;  
            height: 100px; 
            background-color: #fff;
            border-radius: 8px;
            font-size: 55px; 
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
        }

        .reel.spinning span {
            filter: blur(2px);
            animation: moveText 0.1s infinite linear;
        }

        @keyframes moveText {
            0% { transform: translateY(-5px); }
            50% { transform: translateY(5px); }
            100% { transform: translateY(-5px); }
        }

        .spin-btn {
            margin-top: 20px;
            padding: 10px 40px;
            font-size: 22px;
            font-family: inherit;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #FFC107, #FF9800);
            border: 3px solid #E65100;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #bf360c, 0 8px 15px rgba(0,0,0,0.3);
        }

        .spin-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #bf360c; }
        .spin-btn:disabled { background: #999; border-color: #666; cursor: not-allowed; box-shadow: none;}

        .game-title { font-size: 24px; margin-bottom: 20px; text-align: center;}
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>Here We Go! Phonics Spin</h1>
        
        <div class="form-group">
            <label for="classSelect">1. Choose a Class (選擇班級)</label>
            <select id="classSelect">
                <option value="G3">G3 (Aaron, Ian, Jason...)</option>
                <option value="G4">G4 (Henry, James, Kevin...)</option>
                <option value="G5">G5 (Owen, Stellen, Hans...)</option>
                <option value="G6">G6 (Vic, Xavier, Kurtis...)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="bookSelect">2. Choose Book (翰林課本 1-8 冊)</label>
            <select id="bookSelect" onchange="onBookChange()">
                <option value="B1">Book 1 (Aa-Ee, Ff-Jj, Kk-Oo, Pp-Tt, Uu-Zz)</option>
                <option value="B2">Book 2 (-ad/at, -ed/et, -ig/ick, -op/ot, -ub/ut)</option>
                <option value="B3">Book 3 (b/p, d/t, g/c, v/f, z/s)</option>
                <option value="B4">Book 4 (a_e, e_e, i_e, o_e, u_e)</option>
                <option value="B5">Book 5 (ay/ai, ee/ea, ie/y, oa/ow, ue/ui)</option>
                <option value="B6">Book 6 (ng/nk, wh/ph, th, ch/sh, The H Brothers)</option>
                <option value="B7">Book 7 (-er/or, ir/ur, ar/or, oi/oy, ou/ow)</option>
                <option value="B8">Book 8 (pl/bl/cl/gl, cr/gr/tr/dr, sw/sp/st/sk, Short, Long)</option>
            </select>
        </div>

        <div class="form-group">
            <label>3. Choose Units (可複選)</label>
            <div class="unit-controls" id="unitControls">
                <label class="unit-label"><input type="checkbox" class="unit-cb" value="Starter" checked onchange="renderWordList()"> Starter</label>
                <label class="unit-label"><input type="checkbox" class="unit-cb" value="U1" checked onchange="renderWordList()"> Unit 1</label>
                <label class="unit-label"><input type="checkbox" class="unit-cb" value="U2" checked onchange="renderWordList()"> Unit 2</label>
                <label class="unit-label"><input type="checkbox" class="unit-cb" value="U3" checked onchange="renderWordList()"> Unit 3</label>
                <label class="unit-label"><input type="checkbox" class="unit-cb" value="U4" checked onchange="renderWordList()"> Unit 4</label>
            </div>
        </div>

        <div class="form-group">
            <label>4. Add Custom Word (手動新增字詞)</label>
            <div class="custom-word-input-group">
                <input type="text" id="customWordInput" placeholder="輸入單字並按下 Add..." onkeypress="handleKeyPress(event)">
                <button onclick="addCustomWord()">Add</button>
            </div>
        </div>

        <div class="form-group">
            <label>5. Select Words (微調最終清單)</label>
            <div class="word-controls">
                <button onclick="toggleAllWords(true)">Check All (全選)</button>
                <button onclick="toggleAllWords(false)">Uncheck All (全不選)</button>
            </div>
            <div id="wordListContainer" class="word-grid"></div>
        </div>

        <button class="start-btn" onclick="startGame()">Let's Go!</button>
    </div>

    <div id="game-screen">
        <button class="back-btn" onclick="backToSetup()">◀ Back to Menu</button>
        <h1 class="game-title" id="gameTitle">Class - Book - Units</h1>

        <div class="game-stage">
            <div class="student-picker">
                <div class="picker-header">Student Picker</div>
                <div class="name-display" id="nameDisplay">Ready</div>
                <button class="pick-btn" id="pickBtn" onclick="pickStudent()">Pick Name</button>
                <div class="counter" id="studentCounter"></div>
            </div>

            <div class="slot-machine">
                <div class="reels-container" id="reelsContainer"></div>
                <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN!</button>
            </div>
        </div>
    </div>

    <script>
        // --- 資料庫設定 ---

        const classData = {
            "G3": ["Aaron", "Ian", "Jason", "Wei", "Actros", "Shaun", "Jack", "Owen", "William", "Anya", "Vivian", "Minnie", "Ubah"],
            "G4": ["Henry", "James", "Kevin", "Jo", "Jess", "Benjamin", "Jessica", "Stella", "Emily", "Lily", "Levi"],
            "G5": ["Owen", "Stellen", "Hans", "Yuga", "Tony", "Hank", "Peter", "Nina", "Winnie", "Sandy", "Belle", "Selina"],
            "G6": ["Vic", "Xavier", "Kurtis", "Lester", "Jack", "Ryan", "Kai", "Alen", "Namoh", "Una", "Jessie", "Ula", "Kiki"]
        };

        // 完全依照您提供的 8 張圖片進行建檔
        const phonicsData = {
            "B1": { 
                "Starter": ["apple", "ant", "bear", "cat", "dog", "egg", "elephant"], // Aa-Ee
                "U1": ["fish", "fox", "goat", "hat", "igloo", "juice", "jam"], // Ff-Jj
                "U2": ["kite", "lion", "monkey", "net", "nut", "ox", "octopus"], // Kk-Oo
                "U3": ["pig", "queen", "rat", "sun", "tiger", "ten"], // Pp-Tt
                "U4": ["umbrella", "van", "water", "box", "yellow", "zoo", "zebra"] // Uu-Zz
            },
            "B2": { 
                "Starter": ["sad", "mad", "dad", "cat", "bat", "hat", "mat"], // -ad, -at
                "U1": ["bed", "red", "fed", "pet", "wet", "net"], // -ed, -et
                "U2": ["pig", "dig", "big", "sick", "kick", "pick"], // -ig, -ick
                "U3": ["hop", "mop", "top", "hot", "pot", "dot"], // -op, -ot
                "U4": ["tub", "sub", "rub", "nut", "cut", "hut"] // -ub, -ut
            },
            "B3": { 
                "Starter": ["bear", "pear", "big", "pig", "bat", "pat"], // b-, p-
                "U1": ["dog", "tall", "desk", "tent", "dot", "top"], // d-, t-
                "U2": ["goat", "coat", "gap", "cap", "gate", "cake"], // g-, c-
                "U3": ["van", "fan", "vest", "fox", "five", "fish"], // v-, f-
                "U4": ["zoo", "sun", "zip", "sip", "zebra", "sea"] // z-, s-
            },
            "B4": { 
                "Starter": ["mad", "made", "tap", "tape", "cap", "cape"], // a, a_e
                "U1": ["pet", "Pete", "eve", "bed", "red", "these"], // e, e_e
                "U2": ["pin", "pine", "kit", "kite", "bit", "bite"], // i, i_e
                "U3": ["hop", "hope", "not", "note", "pop", "pope"], // o, o_e
                "U4": ["cub", "cube", "tub", "tube", "cut", "cute"] // u, u_e
            },
            "B5": { 
                "Starter": ["cake", "rain", "day", "play", "wait", "name"], // a_e, ai, ay
                "U1": ["Pete", "bee", "see", "sea", "meat", "tree"], // e_e, ee, ea
                "U2": ["kite", "pie", "tie", "cry", "sky", "fly"], // i_e, ie, y
                "U3": ["rose", "boat", "coat", "snow", "show", "bow"], // o_e, oa, ow
                "U4": ["cute", "blue", "glue", "suit", "fruit", "juice"] // u_e, ue, ui
            },
            "B6": { 
                "Starter": ["ring", "sing", "king", "bank", "pink", "sink"], // ng, nk
                "U1": ["whale", "white", "when", "phone", "photo", "dolphin"], // wh, ph
                "U2": ["this", "that", "thin", "math", "path", "bath"], // th (voiced/unvoiced)
                "U3": ["chat", "chin", "rich", "ship", "shop", "fish"], // ch, sh
                "U4": ["ship", "chat", "thin", "whale", "phone"] // The H Brothers review
            },
            "B7": { 
                "Starter": ["sister", "brother", "doctor", "actor", "farmer", "worker"], // -er, -or
                "U1": ["bird", "girl", "shirt", "turn", "burn", "nurse"], // ir, ur
                "U2": ["car", "star", "park", "corn", "fork", "horn"], // ar, or
                "U3": ["coin", "boil", "soil", "toy", "boy", "joy"], // oi, oy
                "U4": ["house", "mouse", "out", "cow", "town", "clown"] // ou, ow
            },
            "B8": { 
                "Starter": ["play", "plum", "black", "clock", "clap", "glue"], // pl, bl, cl, gl
                "U1": ["crab", "crop", "green", "grass", "tree", "trip", "drop"], // cr, gr, tr, dr
                "U2": ["swim", "swan", "spoon", "star", "stop", "desk", "skin"], // sw, sp, st, sk
                "U3": ["cat", "bed", "pig", "dog", "sun"], // Short Vowels (a,e,i,o,u)
                "U4": ["cake", "bee", "kite", "rose", "cute"] // Long Vowels (a,e,i,o,u)
            }
        };

        const bookTitles = {
            "B1": "Book 1", "B2": "Book 2", "B3": "Book 3", "B4": "Book 4",
            "B5": "Book 5", "B6": "Book 6", "B7": "Book 7", "B8": "Book 8"
        };

        let currentStudents = [];
        let currentOriginalStudents = [];
        let currentWordBank = [];
        let customWordsList = []; // 儲存手動新增的字詞
        let currentReelsDOM = [];
        let isSpinning = false;
        let lastWord = "";

        // --- 音效系統 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'tick') {
                osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.05);
                gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'stop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, now);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'pick') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        // --- 手動新增單字 ---
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                addCustomWord();
            }
        }

        function addCustomWord() {
            const input = document.getElementById('customWordInput');
            const word = input.value.trim().toLowerCase();
            
            if(word !== "") {
                if(!customWordsList.includes(word)) {
                    customWordsList.push(word);
                    renderWordList(); // 重新渲染清單，新字會加入
                }
                input.value = ''; // 清空輸入框
                input.focus();
            }
        }

        // --- 動態生成單字微調列表 ---
        function onBookChange() {
            // 切換冊數時，預設勾選所有單元，並清空之前的自訂字詞
            const checkboxes = document.querySelectorAll('.unit-cb');
            checkboxes.forEach(cb => cb.checked = true);
            customWordsList = []; 
            renderWordList();
        }

        function renderWordList() {
            const bookVal = document.getElementById('bookSelect').value;
            const checkedUnits = Array.from(document.querySelectorAll('.unit-cb:checked')).map(cb => cb.value);
            const container = document.getElementById('wordListContainer');
            container.innerHTML = ''; 

            if (checkedUnits.length === 0 && customWordsList.length === 0) {
                container.innerHTML = '<div style="color:red; font-weight:bold;">Please select units or add custom words!</div>';
                return;
            }

            let words = [];
            
            // 抓取被勾選單元的字
            checkedUnits.forEach(unit => {
                if(phonicsData[bookVal][unit]) {
                    words = words.concat(phonicsData[bookVal][unit]);
                }
            });

            // 加入手動新增的字
            words = words.concat(customWordsList);

            // 去除重複單字
            words = [...new Set(words)]; 

            // 生成 checkbox
            words.forEach(word => {
                const label = document.createElement('label');
                label.className = 'word-checkbox-label';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = word;
                cb.checked = true;
                cb.className = 'word-cb';
                
                label.appendChild(cb);
                label.appendChild(document.createTextNode(word));
                container.appendChild(label);
            });
        }

        function toggleAllWords(checkStatus) {
            const checkboxes = document.querySelectorAll('.word-cb');
            checkboxes.forEach(cb => cb.checked = checkStatus);
        }

        // 初始化渲染
        window.onload = () => {
            renderWordList();
        };

        // --- 流程控制 ---
        function startGame() {
            const checkedWordBoxes = document.querySelectorAll('.word-cb:checked');
            if (checkedWordBoxes.length === 0) {
                alert("Please select at least one word! (單字庫不能為空，請至少勾選一個字)");
                return;
            }

            currentWordBank = Array.from(checkedWordBoxes).map(cb => cb.value);
            const classVal = document.getElementById('classSelect').value;
            const bookVal = document.getElementById('bookSelect').value;

            currentOriginalStudents = [...classData[classVal]];
            currentStudents = [...currentOriginalStudents];
            lastWord = ""; 

            // 設定標題
            const checkedUnits = Array.from(document.querySelectorAll('.unit-cb:checked')).map(cb => cb.value);
            const unitsStr = checkedUnits.length > 0 ? `(${checkedUnits.join(", ")})` : "(Custom)";
            document.getElementById('gameTitle').innerText = `${classVal} | ${bookTitles[bookVal]} ${unitsStr}`;

            // 動態生成拉霸格數
            let maxLength = 0;
            currentWordBank.forEach(word => {
                if (word.length > maxLength) maxLength = word.length;
            });

            const container = document.getElementById('reelsContainer');
            container.innerHTML = ''; 
            currentReelsDOM = [];

            for (let i = 0; i < maxLength; i++) {
                const reelDiv = document.createElement('div');
                reelDiv.className = 'reel';
                reelDiv.innerHTML = '<span>?</span>';
                container.appendChild(reelDiv);
                currentReelsDOM.push(reelDiv);
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('nameDisplay').innerText = "Ready";
            updateCounter();
        }

        function backToSetup() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }

        // --- 拉霸邏輯 ---
        function getRandomChar() {
            const chars = "abcdefghijklmnopqrstuvwxyz";
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            let selectedWord;
            do {
                selectedWord = currentWordBank[Math.floor(Math.random() * currentWordBank.length)];
            } while (selectedWord === lastWord && currentWordBank.length > 1);
            lastWord = selectedWord; 
            
            let displayChars = selectedWord.split('');
            while(displayChars.length < currentReelsDOM.length) { 
                displayChars.push(""); 
            }

            currentReelsDOM.forEach(reel => {
                reel.classList.add('spinning');
                reel.querySelector('span').innerText = "";
            });

            const spinInterval = setInterval(() => {
                currentReelsDOM.forEach(reel => {
                    if (reel.classList.contains('spinning')) {
                        reel.querySelector('span').innerText = getRandomChar();
                        if(Math.random() > 0.8) playSound('tick');
                    }
                });
            }, 80);

            for (let i = 0; i < currentReelsDOM.length; i++) {
                setTimeout(() => {
                    const reel = currentReelsDOM[i];
                    reel.classList.remove('spinning');
                    
                    const char = displayChars[i];
                    reel.querySelector('span').innerText = char;

                    if (char !== "") {
                        playSound('stop');
                        reel.animate([{ transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 200 });
                    }

                    if (i === currentReelsDOM.length - 1) {
                        clearInterval(spinInterval);
                        isSpinning = false;
                        document.getElementById('spinBtn').disabled = false;
                    }

                }, 800 + (i * 400));
            }
        }

        // --- 抽籤邏輯 ---
        const nameDisplay = document.getElementById('nameDisplay');
        const pickBtn = document.getElementById('pickBtn');
        const counterDisplay = document.getElementById('studentCounter');

        function updateCounter() {
            counterDisplay.innerText = `${currentStudents.length} names left`;
        }

        function pickStudent() {
            if (currentStudents.length === 0) {
                currentStudents = [...currentOriginalStudents];
                counterDisplay.innerText = "List Reset!";
                setTimeout(updateCounter, 1000);
            }

            pickBtn.disabled = true;
            let shuffleCount = 0;
            const maxShuffle = 20;

            const shuffleInterval = setInterval(() => {
                const randomTempName = currentStudents[Math.floor(Math.random() * currentStudents.length)];
                nameDisplay.innerText = randomTempName;
                playSound('tick');
                shuffleCount++;

                if (shuffleCount >= maxShuffle) {
                    clearInterval(shuffleInterval);
                    finalizeName();
                }
            }, 80);
        }

        function finalizeName() {
            const randomIndex = Math.floor(Math.random() * currentStudents.length);
            const selectedName = currentStudents[randomIndex];
            currentStudents.splice(randomIndex, 1);
            
            nameDisplay.innerText = selectedName;
            
            if (selectedName.length > 7) {
                 nameDisplay.style.fontSize = "18px";
            } else {
                 nameDisplay.style.fontSize = "22px";
            }

            nameDisplay.style.color = "#D32F2F";
            playSound('pick');
            
            setTimeout(() => {
                nameDisplay.style.color = "#2E7D32";
                pickBtn.disabled = false;
                updateCounter();
            }, 1000);
        }
    </script>
</body>
</html>
